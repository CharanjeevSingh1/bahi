name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & unit test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Check module boundaries
        run: ./gradlew checkModuleBoundaries

      - name: Compile
        run: ./gradlew assembleDebug --stacktrace -PwarningsAsErrors=true

      # Separate from the debug compile above so an R8/shrinker failure --
      # a different failure mode than a plain compile error, usually a
      # missing keep rule for something reflection- or serialization-based
      # -- shows up as its own red step instead of being buried inside
      # "Compile". Local, warm-cache cost is ~25s on top of assembleDebug;
      # revisit if a cold CI runner makes this step expensive enough to
      # move to nightly.yml instead of blocking every push.
      - name: Compile release (R8)
        run: ./gradlew assembleRelease --stacktrace -PwarningsAsErrors=true

      - name: Unit tests
        run: ./gradlew unitTests --stacktrace

      - name: Android Lint
        run: ./gradlew lintDebug

      - name: Verify Room schemas are committed
        run: |
          if [ -n "$(git status --porcelain core/database/schemas)" ]; then
            echo "::error::Room schema changed but was not committed."
            echo "Run ./gradlew :core:database:kspDebugKotlin and commit core/database/schemas."
            git --no-pager diff -- core/database/schemas
            exit 1
          fi

      - name: Regenerate module graph
        run: ./gradlew moduleGraph

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/
          retention-days: 7

  instrumented:
    name: Instrumented tests (migrations + Compose UI)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Was PR-only ("emulator jobs are slow"), but this project pushes
    # directly to main rather than through PRs -- gating on pull_request
    # meant this job, and MigrationTest specifically, had never run at all.
    # Revisit if the suite grows enough that per-push cost outweighs that.

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace

name: Nightly convergence

# docs/sync-design.md §10.3, §13 slice 7: the CI push in ci.yml's
# `instrumented` job runs ConvergencePropertyTest at its default 50 seeds --
# fixed, cheap, blocking. This runs the same test at a much larger corpus
# (1,000 seeds) on a schedule instead, so a rare interleaving has a real
# chance to surface without making every push pay for it. Runs only this one
# test class, not the whole instrumented suite -- MigrationTest and Compose
# UI tests get no more signal from running 1,000 times than once.

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch:

jobs:
  nightly-convergence:
    name: Convergence property test (1,000 seeds)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the property test at 1,000 seeds
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: >
            ./gradlew :core:sync:connectedDebugAndroidTest -PseedCount=1000
            -Pandroid.testInstrumentationRunnerArguments.class=dev.charanjeev.bahi.core.sync.convergence.ConvergencePropertyTest
            --stacktrace

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-convergence-reports
          path: |
            core/sync/build/reports/androidTests/
            core/sync/build/outputs/androidTest-results/
          retention-days: 14
